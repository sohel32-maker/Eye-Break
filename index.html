<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="style.css"><title>EyePause – 20:20:20</title></head><body><main class="app"><header><img class="logo" src="icon-192.png"><div><h1>EyePause</h1><p>20 : 20 : 20</p></div><button id="install" hidden>Install</button></header><section class="card timer-card"><small id="mode">FOCUS TIME</small><div id="timer">20:00</div><p id="hint">২০ মিনিট কাজের পর চোখকে বিরতি দাও।</p><div class="track"><div id="bar"></div></div><div class="actions"><button id="start" class="primary">Start</button><button id="pause">Pause</button><button id="reset">Reset</button></div><button id="break" class="link">এখনই বিরতি নাও</button></section><section class="card"><h2>Settings</h2><label>কাজের সময় (মিনিট)<input id="work" type="number" min="1" max="180" value="20"></label><label>বিরতির সময় (সেকেন্ড)<input id="rest" type="number" min="5" max="300" value="20"></label><label class="check"><input id="soundOn" type="checkbox" checked> সাউন্ড চালু</label><label>নিজের সাউন্ড (WAV/MP3)<input id="soundFile" type="file" accept="audio/*"></label><div class="actions"><button id="preview">Preview sound</button><button id="clear">Default sound</button></div><button id="notify" class="wide">Notification চালু করুন</button><p id="status" class="status">Settings এই ব্রাউজারে সংরক্ষিত থাকবে।</p></section><footer>আজকের সম্পন্ন বিরতি: <b id="count">0</b></footer></main><audio id="audio"></audio><script src="app.js"></script></body></html>
